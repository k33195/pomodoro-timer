<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Pomodoro Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" id="startOverlay">
        <div class="overlay-content">
            <h1>Pomodoro Timer</h1>
            <p>クリックして開始 (音声再生のため)</p>
            <button id="startBtn">スタート</button>
        </div>
    </div>

    <div class="app-container">
        <div class="status-badge" id="statusBadge">WAITING</div>
        
        <div class="timer-display">
            <span id="minutes">25</span><span class="colon">:</span><span id="seconds">00</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="info-panel">
            <div class="next-event">
                <span class="label">NEXT:</span>
                <span class="value" id="nextEventTime">19:30</span>
            </div>
            <div class="current-time">
                <span id="currentTime">19:05</span>
            </div>
        </div>

        <div class="controls">
            <button class="icon-btn" id="muteBtn" title="ミュート切替">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
            <button class="icon-btn" id="themeBtn" title="テーマ変更">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </div>

    <!-- Simple chime sound (placeholder or use a local file if available, here using a data URI for a simple beep/chime to ensure it works without external assets first, but for premium feel ideally we load a nice mp3) -->
    <!-- Using a short beep data URI for demonstration functionality. In a real deployment, we would use a nice mp3 file. -->
    <audio id="chime" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
